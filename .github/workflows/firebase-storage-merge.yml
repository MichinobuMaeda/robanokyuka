name: Deploy to Firebase Storage Rules on merge
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/firebase-storage-merge.yml
      - firebase.json
      - storage.rules
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci
      - name: Deploy Storage
        env:
          WORK_DIR: ${{ runner.temp }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROBANOKYUKA }}' \
          > $GOOGLE_APPLICATION_CREDENTIALS
          npx firebase deploy --only storage
